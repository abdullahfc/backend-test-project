name: Deploy Backend to CyberPanel

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Get the latest code
        uses: actions/checkout@v4

      - name: Install sshpass and rsync
        run: sudo apt-get update && sudo apt-get install sshpass rsync -y

      - name: Create Backend Folder and Copy Files
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          # First, this safely creates the 'backend' folder on the server if it doesn't exist yet
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_IP }} "mkdir -p /home/test-frontend.local/backend"
          
          # Then, this copies the backend files into that new folder
          sshpass -e rsync -avz -e "ssh -o StrictHostKeyChecking=no" ./ ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_IP }}:/home/test-frontend.local/backend/
